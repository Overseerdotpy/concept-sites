:root{
  --snow-50:#F8F9FA;--snow-100:#F5F4F1;--snow-200:#E0E6E7;--snow-300:#C4CCCE;--snow-400:#9AA4A6;--snow-600:#546063;--snow-700:#3C474A;--snow-800:#283235;--snow-900:#1B2224;--snow-950:#091113;
  --rust-50:#FFF2EE;--rust-300:#FBA58A;--rust-400:#EA7F5E;--rust-600:#A8432C;--rust-700:#893A20;--rust-800:#6A3025;--rust-950:#291008;
  --ochre-100:#FFECCF;--ochre-300:#F6C16B;--ochre-700:#7B560D;
  --bg:var(--snow-100);--surface:#FFFFFF;--border:var(--snow-200);--border-strong:var(--snow-300);
  --fg:var(--snow-900);--fg-2:var(--snow-700);--muted:var(--snow-600);
  --primary:var(--rust-600);--primary-hover:var(--rust-700);--on-primary:#FFFFFF;--primary-text:var(--rust-700);
  --few:var(--ochre-700);--few-bg:var(--ochre-100);--ring:var(--rust-600);--route:#A8432C;--terrain:#E4EFF5;--terrain-strong:#CEDDE7;--open:#23593D;--sure:#395768;--full:#3C474A;
  --display:"Barlow Condensed","Arial Narrow",ui-sans-serif,sans-serif;--sans:"Barlow",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:var(--snow-950);--surface:var(--snow-900);--border:var(--snow-800);--border-strong:var(--snow-700);
  --fg:var(--snow-100);--fg-2:var(--snow-300);--muted:var(--snow-400);
  --primary:var(--rust-400);--primary-hover:var(--rust-300);--on-primary:var(--rust-950);--primary-text:var(--rust-300);
  --few:var(--ochre-300);--few-bg:rgba(246,193,107,.14);--ring:var(--rust-400);--route:#EA7F5E;--terrain:#172C38;--terrain-strong:#28414F;--open:#92CEAA;--sure:#AFC5D2;--full:#C4CCCE;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:var(--snow-950);--surface:var(--snow-900);--border:var(--snow-800);--border-strong:var(--snow-700);
  --fg:var(--snow-100);--fg-2:var(--snow-300);--muted:var(--snow-400);
  --primary:var(--rust-400);--primary-hover:var(--rust-300);--on-primary:var(--rust-950);--primary-text:var(--rust-300);
  --few:var(--ochre-300);--few-bg:rgba(246,193,107,.14);--ring:var(--rust-400);--route:#EA7F5E;--terrain:#172C38;--terrain-strong:#28414F;--open:#92CEAA;--sure:#AFC5D2;--full:#C4CCCE;color-scheme:dark}

:root{box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ring);outline-offset:3px;border-radius:6px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
p{margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-left:24px;padding-right:24px}
.label{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:15px;line-height:1.2}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:10px;font-family:var(--sans);font-size:16px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:background-color .2s,border-color .2s,transform .2s}
.btn-primary{background:var(--rust-600);color:#FFFFFF}
.btn-primary:hover{background:var(--rust-700)}
.btn-glass{background:rgba(9,17,19,.28);color:#FFFFFF;border-color:rgba(255,255,255,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn-glass:hover{background:rgba(9,17,19,.45);border-color:#FFFFFF}
.btn svg{width:18px;height:18px}


:root{--open-bg:#D6F4E1;--danger:#BC1F4B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--open-bg:rgba(146,206,170,.14);--danger:#FE93A1}}
:root[data-theme="dark"]{--open-bg:rgba(146,206,170,.14);--danger:#FE93A1}

.bnav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px)}
.bnav-in{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}
.nav-mark{height:22px;width:auto;display:block}.wm-ink{fill:var(--fg)}.wm-peak{fill:var(--route)}
.bnav a.back{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--fg-2);display:inline-flex;align-items:center;gap:8px;min-height:44px}
.bnav a.back:hover{color:var(--fg)}

.bnav .who{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.bnav .who i{width:36px;height:36px;border-radius:50%;background:var(--rust-600);color:#FFFFFF;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:700}
/* ---------- Countdown hero ---------- */
.thero{position:relative;color:#FFFFFF;overflow:hidden;isolation:isolate;border-radius:24px;margin-top:24px;min-height:380px;display:flex;align-items:flex-end}
.thero .ph{position:absolute;inset:0;background-size:cover;background-position:center 40%;z-index:-2}
.thero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(9,17,19,.85),rgba(9,17,19,.25) 60%,rgba(9,17,19,.1))}
.thero-in{width:100%;padding:clamp(22px,4vw,40px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
@media (max-width:760px){.thero-in{grid-template-columns:1fr}}
.thero .label{color:#FBA58A}
.thero h1{font-size:clamp(40px,5.4vw,80px);line-height:.9;margin:10px 0 8px}
.thero p{color:rgba(255,255,255,.88);font-size:17px}
.count{display:flex;gap:10px}
.count div{min-width:84px;padding:12px 14px;border-radius:14px;background:rgba(9,17,19,.45);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);text-align:center}
.count b{display:block;font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.count span{font-size:12px;color:rgba(255,255,255,.75);font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
/* ---------- Grid ---------- */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;padding-top:24px;padding-bottom:96px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.c7{grid-column:span 7}.c5{grid-column:span 5}.c12{grid-column:span 12}
@media (max-width:980px){.c7,.c5{grid-column:span 12}}
.card h2{font-size:30px;line-height:.98}
.chead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.prog{font-family:var(--display);font-weight:600;font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden}
.bar span{display:block;height:100%;background:var(--route);border-radius:3px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.task{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--border)}
.task:first-child{border-top:0}
.box{position:relative;width:26px;height:26px;flex:none}
.box input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.box i{position:absolute;inset:0;border-radius:8px;border:2px solid var(--border-strong);pointer-events:none;transition:background-color .2s,border-color .2s}
.box i::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #FFFFFF;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);transition:transform .2s cubic-bezier(.34,1.5,.64,1)}
.box input:checked+i{background:var(--open);border-color:var(--open)}
.box input:checked+i::after{transform:rotate(45deg) scale(1)}
.box input:focus-visible+i{outline:2px solid var(--ring);outline-offset:2px}
.task .t{flex:1;min-width:0}
.task .t b{display:block;font-weight:600}
.task .t span{font-size:14px;color:var(--muted)}
.task.done .t b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--border-strong)}
.due{font-family:var(--display);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-2);white-space:nowrap}
.due.soon{color:var(--few)}
.mini{font:inherit;font-size:14px;font-weight:600;min-height:40px;padding:0 14px;border-radius:9px;border:0;background:var(--rust-600);color:#FFFFFF;cursor:pointer}
.mini:hover{background:var(--rust-700)}
/* guide */
.guide-c{display:flex;gap:16px;align-items:flex-start}
.guide-c i{width:64px;height:64px;border-radius:50%;background:var(--rust-600);color:#FFFFFF;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:700;font-size:22px;flex:none}
.guide-c b{display:block;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:24px;line-height:1}
.guide-c span{font-size:14px;color:var(--muted)}
.msg{background:var(--bg);border:1px solid var(--border);border-radius:14px 14px 14px 4px;padding:14px 16px;font-size:16px;color:var(--fg-2)}
.msg small{display:block;margin-top:8px;color:var(--muted);font-size:13px}
/* itinerary */
.spark{width:100%;height:120px;display:block}
.spark .a{fill:var(--terrain)}.spark .l{fill:none;stroke:var(--route);stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.days{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.days li{border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.days .label{font-size:13px;color:var(--primary-text)}
.days b{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:20px;line-height:1}
.days .nums{font-family:var(--display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;color:var(--fg-2)}
.days small{font-size:13px;color:var(--muted)}
/* training */
.phases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.phase{display:grid;grid-template-columns:88px minmax(0,1fr);gap:6px 14px;align-items:start;padding:14px;border-radius:14px;border:1px solid var(--border)}
.phase .w{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:18px;line-height:1.1}
.phase .w small{display:block;font-family:var(--sans);font-weight:400;text-transform:none;font-size:13px;color:var(--muted);margin-top:2px}
.phase p{font-size:15px;color:var(--fg-2)}
.phase.now{border:2px solid var(--route);padding:13px}
/* packing */
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:18px}
.packs .label{font-size:13px;color:var(--muted)}
.plist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.plist li label{display:flex;align-items:center;gap:12px;min-height:40px;cursor:pointer;font-size:15px}
.plist li.got span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--border-strong)}
.plist .box{width:22px;height:22px}.plist .box i{border-radius:6px}.plist .box i::after{left:6px;top:2px;width:5px;height:10px}
.rented{color:var(--primary-text);font-weight:500}
.toast{position:fixed;left:50%;bottom:0;transform:translate(-50%,20px);margin-bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--snow-900);color:var(--snow-100);border-radius:12px;padding:12px 16px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1);z-index:20;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.motion .card{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.bar span,.box i,.box i::after,.toast{transition:none}}

/* ---------- Coloured buttons: Frutiger button by SelfMadeSystem (Uiverse, MIT), rebuilt in pure CSS and recoloured to rust ---------- */
.btn-primary,.mini{position:relative;isolation:isolate;overflow:hidden;color:#FFFFFF;border:2px solid transparent;border-radius:12px;text-shadow:1px 1px 2px rgba(0,0,0,.45);
  background:
    radial-gradient(130% 95% at 50% -42%, rgba(255,255,255,.58) 0 47%, rgba(255,255,255,.2) 49.5%, rgba(255,255,255,0) 50.5%) padding-box,   /* the glossy top */
    radial-gradient(circle at 50% 108%, rgba(255,166,124,.95) 8%, rgba(255,166,124,0) 58%) padding-box,                                    /* glow from below */
    linear-gradient(#6A3025, #B04A30) padding-box,                                                                                          /* inner gradient */
    linear-gradient(#5A2418, #E0805C) border-box;                                                                                           /* the rim */
  box-shadow:0 4px 6px rgba(0,0,0,.32);transition:box-shadow .3s,transform .3s,filter .3s}
.btn-primary:hover,.mini:hover{background:
    radial-gradient(130% 95% at 50% -42%, rgba(255,255,255,.62) 0 47%, rgba(255,255,255,.22) 49.5%, rgba(255,255,255,0) 50.5%) padding-box,
    radial-gradient(circle at 50% 108%, rgba(255,176,136,1) 10%, rgba(255,176,136,0) 62%) padding-box,
    linear-gradient(#73351F, #BC5236) padding-box,
    linear-gradient(#5A2418, #EA8C66) border-box;box-shadow:0 6px 12px rgba(0,0,0,.38)}
/* the glint that sweeps across */
.btn-primary::before,.mini::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  background:linear-gradient(-65deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.5) 50%, rgba(255,255,255,0) 70%) no-repeat;background-size:200% 100%;
  animation:frut-glint 3s ease infinite}
@keyframes frut-glint{0%{background-position:130%;opacity:1}to{background-position:-166%;opacity:0}}
/* pressed in */
.btn-primary::after,.mini::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;box-shadow:inset 0 2px 8px -2px rgba(0,0,0,0);transition:box-shadow .3s}
.btn-primary:active,.mini:active{box-shadow:0 0 0 rgba(0,0,0,0)}
.btn-primary:active::after,.mini:active::after{box-shadow:inset 0 2px 8px -2px rgba(0,0,0,.7)}
@media (prefers-reduced-motion: reduce){.btn-primary::before,.mini::before{animation:none;opacity:0}.btn-primary,.mini{transition:none}}
</style>

  var toastT; function toast(t) { $("toast").textContent = t; $("toast").classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function () { $("toast").classList.remove("show"); }, 3000); }
  function box(id, checked, label) { return '<span class="box"><input type="checkbox" id="' + id + '"' + (checked ? " checked" : "") + (label ? ' aria-label="' + esc(label) + '"' : "") + '><i></i></span>'; }

  function render() {
    load();
    var t = D.trips[B.trip], start = new Date(B.start), end = new Date(start), due = new Date(B.due);
    end.setDate(end.getDate() + t.days - 1);
    var first = (B.names[0] || "").trim().split(/\s+/)[0] || "you";
    $("who-ref").textContent = "Booking " + B.ref; $("who-ini").textContent = first.charAt(0).toUpperCase();
    $("t-ph").style.backgroundImage = "url(" + t.img + ")"; $("t-ph").setAttribute("aria-label", t.name + " photo");
    $("t-kind").textContent = t.kind + " · " + t.days + " days" + (B.n > 1 ? " · " + B.n + " travelers" : "");
    $("t-title").textContent = t.name;
    $("t-when").textContent = nice(start) + " to " + nice(end) + ". Meet your guide in the valley at 8 a.m. on day one.";
    var days = Math.max(0, Math.round((start - TODAY) / 864e5));
    countTo($("c-days"), days); countTo($("c-weeks"), Math.floor(days / 7));

    // before you go
    var balPaid = !!store.balance;
    var tasks = [
      { id: "balance", b: "Pay the balance", s: usd(B.total - B.deposit) + " · free cancellation until then", d: due, pay: !balPaid },
      { id: "fitness", b: "Read your training plan", s: B.ready.indexOf(0) >= 0 ? "You said 'not yet' to one question, so this one matters" : "Eight weeks, starting " + short(new Date(start.getTime() - 56 * 864e5)), d: new Date(start.getTime() - 56 * 864e5) },
      { id: "insurance", b: "Add travel insurance with mountain rescue", s: "Up to 4,000 m, covering helicopter evacuation", d: due },
      { id: "contact", b: "Add an emergency contact", s: "Someone at home your guide can reach", d: due },
      { id: "boots", b: "Break in your boots", s: B.boots ? "Size EU " + B.boots + " noted for your rented crampons" : "Wear them on at least five long walks", d: new Date(start.getTime() - 21 * 864e5) }
    ];
    var doneN = 0;
    $("tasks").innerHTML = tasks.map(function (k) {
      var done = !!store[k.id]; if (done) doneN++;
      var soon = !done && (k.d - TODAY) / 864e5 < 45;
      return '<li class="task' + (done ? " done" : "") + '">' + box("tk-" + k.id, done, k.b) + '<label class="t" for="tk-' + k.id + '"><b>' + k.b + "</b><span>" + k.s + "</span></label>" +
        (k.pay ? '<button type="button" class="mini" data-pay>Pay ' + usd(B.total - B.deposit) + "</button>" : '<span class="due' + (soon ? " soon" : "") + '">' + (done ? "Done" : "By " + short(k.d)) + "</span>") + "</li>";
    }).join("");
    $("todo-prog").textContent = doneN + " of " + tasks.length + " done"; $("todo-bar").style.width = (doneN / tasks.length * 100) + "%";
    tasks.forEach(function (k) { $("tk-" + k.id).addEventListener("change", function () { store[k.id] = this.checked; save(); render(); }); });
    var pay = document.querySelector("[data-pay]");
    if (pay) pay.addEventListener("click", function () { store.balance = true; save(); render(); toast("Balance paid. You're all set for " + nice(start) + "."); });

    // guide
    $("g-ini").textContent = t.guide[0]; $("g-name").textContent = t.guide[1]; $("g-since").textContent = "IFMGA guide · guiding since " + t.guide[2];
    $("g-msg").innerHTML = "Hi " + esc(first) + "! I'm leading your " + esc(t.name.toLowerCase()) + ". Don't worry about anything technical; we'll practice it all together. Message me any time before we go." + "<small>" + esc(t.guide[1]) + " · this week</small>";

    // day by day
    var it = D.itin[B.trip];
    var km = it.reduce(function (a, d) { return a + d[1]; }, 0), up = it.reduce(function (a, d) { return a + d[2]; }, 0);
    $("itin-sum").textContent = km.toFixed(1) + " km · +" + up.toLocaleString("en-US") + " m";
    $("days").innerHTML = it.map(function (d, i) { return '<li><span class="label">Day ' + (i + 1) + " · " + short(new Date(start.getTime() + i * 864e5)) + "</span><b>" + d[0] + '</b><span class="nums">' + d[1].toFixed(1) + " km · +" + d[2].toLocaleString("en-US") + " m</span><small>" + d[3] + "</small></li>"; }).join("");
    var sp = $("spark"); sp.innerHTML = "";
    if (B.trip === "glacier") {
      var P = D.pts, mx = P[P.length - 1][0], lo = 1300, hi = 3400;
      var line = "M" + P.map(function (p) { return (p[0] / mx * 1000).toFixed(1) + " " + (10 + (1 - (p[1] - lo) / (hi - lo)) * 100).toFixed(1); }).join(" L");
      sp.innerHTML = '<path class="a" d="' + line + ' L1000 120 L0 120 Z"/><path class="l" d="' + line + '"/>';
    } else sp.style.display = "none";

    // training
    var tstart = new Date(start.getTime() - 56 * 864e5), wk = Math.floor((TODAY - tstart) / (7 * 864e5)) + 1;
    $("train-sub").textContent = wk < 1 ? "Your eight weeks start on " + nice(tstart) + ". Until then, keep walking every week." : "You're in week " + Math.min(wk, 8) + " of 8.";
    var ph = [["Weeks 1–3", "Walk three times a week, building to a 3-hour hilly hike."], ["Weeks 4–6", "Add elevation: stairs or hill repeats, up to 800 m in a session."], ["Weeks 7–8", "Back-to-back days with an 8 kg pack, 5 to 6 hours each."]];
    $("phases").innerHTML = ph.map(function (p, i) {
      var from = new Date(tstart.getTime() + [0, 21, 42][i] * 864e5), now = wk >= [1, 4, 7][i] && wk <= [3, 6, 8][i];
      return '<li class="phase' + (now ? " now" : "") + '"><span class="w">' + p[0] + "<small>From " + short(from) + "</small></span><p>" + p[1] + "</p></li>";
    }).join("");

    // packing
    var groups = [["Wear", ["Broken-in mountain boots", "Hiking trousers", "Base layer top", "Sun hat and sunglasses"]],
                  ["In your pack", ["Waterproof jacket and trousers", "Warm mid layer", "Gloves (two pairs)", "1.5 liters of water", "Sunscreen and lip balm", "Head torch", "Hut sleeping liner"]]];
    if (B.trip !== "trek") groups.push(["Technical kit", B.rent ? ["Crampons (rented)", "Ice axe (rented)", "Harness and helmet (rented)"] : ["Crampons", "Ice axe", "Harness and helmet"]]);
    var got = 0, all = 0;
    $("packs").innerHTML = groups.map(function (g, gi) {
      return '<div><span class="label">' + g[0] + '</span><ul class="plist">' + g[1].map(function (item, ii) {
        var id = "pk-" + gi + "-" + ii, has = !!store[id]; all++; if (has) got++;
        return '<li class="' + (has ? "got" : "") + '"><label for="' + id + '">' + box(id, has) + '<span class="' + (/rented/.test(item) ? "rented" : "") + '">' + item + "</span></label></li>";
      }).join("") + "</ul></div>";
    }).join("");
    $("pack-prog").textContent = got + " of " + all + " packed";
    $("packs").querySelectorAll("input").forEach(function (c) { c.addEventListener("change", function () { store[c.id] = c.checked; save(); render(); }); });
  }
  var counted = {};
  function countTo(el, n) {
    if (counted[el.id] === n) { el.textContent = n; return; }
    counted[el.id] = n;
    if (!document.documentElement.classList.contains("motion")) { el.textContent = n; return; }
    var t0 = performance.now();
    (function step(now) { var p = Math.min(1, (now - t0) / 1100); el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); })(t0);
  }
  window.addEventListener("message", function (e) { if (e.data && e.data.booking) { B = e.data.booking; render(); } });
  try { var fromLink = JSON.parse(decodeURIComponent(location.hash.slice(1))); if (fromLink && fromLink.ref && D.trips[fromLink.trip]) B = fromLink; } catch (e) {}
  render();
})();
</script>
<script>(function(){if(!window.__NV_HUB)return;document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[data-hub]");if(!a)return;e.preventDefault();parent.postMessage({hub:"goto",to:a.getAttribute("data-hub")},"*")})})();</script>
